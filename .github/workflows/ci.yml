name: Linux native + Rust + Wayland transport
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-framebuffer:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure C experiment
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build C experiment
        run: cmake --build build --parallel 2
      - name: C headless integration test
        run: POCKET_BIN_DIR="$PWD/build" python3 tests/test_runtime.py

  rust-session:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Rust unit tests
        run: cargo test --workspace --locked
      - name: Rust build
        run: cargo build --workspace --locked
      - name: Native Linux DRM/KMS discovery (headless allowed)
        run: |
          ./target/debug/pokdrm
          ./target/debug/pokdrm --help
      - name: IPC and child-process integration test
        run: python3 tests/ipc_integration.py
      - name: Nested Wayland game process environment isolation test
        run: python3 tests/game_wayland_isolation.py

  wayland-transport:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: graphics/wayland-layer
    steps:
      - uses: actions/checkout@v4
      - name: Build Wayland layer client
        run: cargo build
      - name: Test diagnostic surface buffers
        run: cargo test
      - name: CLI help
        run: ./target/debug/pokshell-layer --help
      - name: System menu refuses host-display fallback
        run: |
          set -eu
          if ./target/debug/pokshell-layer --menu; then
            echo "ERROR menu accepted missing --display" >&2
            exit 1
          fi
          if ./target/debug/pokshell-layer --menu --display wayland-0; then
            echo "ERROR menu accepted KDE display" >&2
            exit 1
          fi
          if ./target/debug/pokshell-layer --menu --display pokshell-missing; then
            echo "ERROR menu accepted missing pokcomp socket" >&2
            exit 1
          fi
      - name: Install headless wlroots compositor
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sway
      - name: Wayland layer-shell protocol smoke test
        if: matrix.runner == 'ubuntu-24.04'
        run: python3 tests/headless_wayland.py


  smithay-nested-compositor:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust/compositor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install EGL and Wayland build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev
      - name: Build nested Smithay compositor
        run: cargo build
      - name: Test command-line argument validation
        run: cargo test
      - name: Help works without a graphical session
        run: ./target/debug/pokcomp --help
      - name: Build existing layer client for integration
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo build --manifest-path ../../graphics/wayland-layer/Cargo.toml
      - name: Install software headless wlroots host
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sway weston libsdl2-2.0-0 libgl1-mesa-dri
      - name: Build existing pokshelld and pokctl for integration
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo build --manifest-path ../../rust/Cargo.toml --workspace --locked
      - name: Smithay nested game and layer integration test
        if: matrix.runner == 'ubuntu-24.04'
        run: python3 tests/headless_nested.py
      - name: SDL2 game must use pokcomp Wayland instead of KDE X11
        if: matrix.runner == 'ubuntu-24.04'
        run: python3 tests/headless_nested.py --sdl2
      - name: SDL2 XDG fullscreen request and game/overlay coexistence
        if: matrix.runner == 'ubuntu-24.04'
        run: python3 tests/headless_nested.py --sdl2-fullscreen

      - name: Game menu render and keyboard focus lifecycle
        if: matrix.runner == 'ubuntu-24.04'
        run: python3 tests/headless_nested.py --menu
