name: Linux native alpha
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Native Linux integration test
        run: POCKET_BIN_DIR="$PWD/build" python3 tests/test_runtime.py
      - name: Headless image smoke test
        run: |
          ./build/pocket-session --headless --frames 2 --screenshot /tmp/pokshell.ppm
          test -s /tmp/pokshell.ppm
